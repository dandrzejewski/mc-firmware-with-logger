name: Build RAK3401 Repeater (packet logging)

# Mirrors an upstream MeshCore repeater release (meshcore-dev/MeshCore tag
# repeater-vX.Y.Z) for the RAK3401 1W board, built unmodified except for the
# build-time flag -D MESH_PACKET_LOGGING=1 (for meshcoretomqtt).
# The release here uses the same tag name as upstream.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream repeater version to mirror, e.g. v1.18.0 (builds tag repeater-v1.18.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  UPSTREAM_REPO: meshcore-dev/MeshCore
  PIO_ENV: RAK_3401_repeater
  EXTRA_BUILD_FLAGS: "-D MESH_PACKET_LOGGING=1"
  FILE_SUFFIX: "-logging"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like v1.18.0 (got '$INPUT_VERSION')"
            exit 1
          fi
          echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=repeater-${INPUT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check out upstream release tag
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: refs/tags/${{ steps.version.outputs.tag }}

      - name: Set up build environment
        uses: ./.github/actions/setup-build-environment

      - name: Record upstream commit
        id: commit
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "full_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        env:
          FIRMWARE_VERSION: ${{ steps.version.outputs.version }}
          PLATFORMIO_BUILD_FLAGS: ${{ env.EXTRA_BUILD_FLAGS }}
        run: /usr/bin/env bash build.sh build-firmware "$PIO_ENV"

      - name: Add suffix to output files
        run: |
          cd out
          for f in *; do
            mv -- "$f" "${f%.*}${FILE_SUFFIX}.${f##*.}"
          done
          ls -l

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Repeater Firmware ${{ steps.version.outputs.version }} (RAK3401, packet logging)"
          body: |
            Mirror of upstream `${{ env.UPSTREAM_REPO }}` release `${{ steps.version.outputs.tag }}`, built for `${{ env.PIO_ENV }}`.

            - Upstream release: https://github.com/${{ env.UPSTREAM_REPO }}/releases/tag/${{ steps.version.outputs.tag }}
            - Upstream commit: `${{ steps.commit.outputs.full_sha }}`
            - Device version string: `${{ steps.version.outputs.version }}-${{ steps.commit.outputs.short_sha }}`
            - Only change from stock: `${{ env.EXTRA_BUILD_FLAGS }}`
          files: out/*
